<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Student Club Member Manager</title>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 rounded">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">Q2 Portfolio</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">SW1</a>
            <a class="nav-link" href="element_checker.html">Skills Test</a>
            <a class="nav-link" href="club_members.html">Drill 2</a>
            <a class="nav-link" href="meet_thecreator.html">Creator</a>
        </div>
    </div>
</nav>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }
        .card-custom {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
        }
        .form-control:focus {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .form-control::placeholder {
            color: #94a3b8;
        }
        .btn-custom {
            background-color: #6366f1;
            color: #ffffff;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }
        .btn-custom:hover {
            background-color: #4f46e5;
            color: #ffffff;
            transform: translateY(-1px);
        }
        #output {
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container" style="max-width: 520px;">
        <div class="card card-custom p-4">
            
            <h3 class="fw-bold mb-4 text-center text-light">Student Club Roster</h3>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <input type="text" id="first_name" class="form-control" placeholder="First Name">
                </div>
                <div class="col-6">
                    <input type="text" id="last_name" class="form-control" placeholder="Last Name">
                </div>
            </div>

            <button py-click="add_member" class="btn btn-custom w-100 py-2 mb-4">Submit Member</button>

            <div id="output" class="p-3">
                <p class="text-muted text-center mb-0">Enter a name above and click submit to display the member list.</p>
            </div>

        </div>
    </div>

    <script type="py" src="main.py"></script>
    
</body>
</html>
